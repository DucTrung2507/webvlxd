name: Deploy VLXD Minh Hung to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'vlxd-minh-hung-optimized/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test vlxd-minh-hung-optimized/tests/*.test.js
      - name: Prepare website
        run: |
          mkdir -p _site
          cp vlxd-minh-hung-optimized/index.html _site/
          cp -R vlxd-minh-hung-optimized/css vlxd-minh-hung-optimized/js vlxd-minh-hung-optimized/images _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
